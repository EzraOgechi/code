<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
</head>
<body>
    <h1>Simple Calculator</h1>

    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">

    <select id="operation">
        <option value="add">Add</option>
        <option value="subtract">Subtract</option>
        <option value="multiply">Multiply</option>
        <option value="divide">Divide</option>
        <option value="power">Power (num1^num2)</option>
        <option value="sqrt1">Square Root of num1</option>
        <option value="sqrt2">Square Root of num2</option>
        <option value="modulus">Modulus (num1 % num2)</option>
        <option value="max">Maximum</option>
        <option value="min">Minimum</option>
    </select>

    <button onclick="calculate()">Calculate</button>

    <h2>Result: <span id="result"></span></h2>

    <script>
        function calculate() {
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);
            const operation = document.getElementById('operation').value;
            let result;

            // Basic validation
            if (isNaN(num1) && operation !== "sqrt2") {
                alert("Please enter the first number.");
                return;
            }
            if (isNaN(num2) && !["sqrt1", "sqrt2"].includes(operation)) {
                alert("Please enter the second number.");
                return;
            }

            switch (operation) {
                case "add":
                    result = num1 + num2;
                    break;

                case "subtract":
                    result = num1 - num2;
                    break;

                case "multiply":
                    result = num1 * num2;
                    break;

                case "divide":
                    if (num2 === 0) {
                        alert("Cannot divide by zero.");
                        return;
                    }
                    result = num1 / num2;
                    break;

                case "power":
                    result = Math.pow(num1, num2);
                    break;

                case "sqrt1":
                    result = Math.sqrt(num1);
                    break;

                case "sqrt2":
                    result = Math.sqrt(num2);
                    break;

                case "modulus":
                    result = num1 % num2;
                    break;

                case "max":
                    result = Math.max(num1, num2);
                    break;

                case "min":
                    result = Math.min(num1, num2);
                    break;

                default:
                    alert("Invalid operation.");
                    return;
            }

            document.getElementById('result').textContent = result;
        }
    </script>
</body>
</html>
